services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    shm_size: "1gb"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - generated:/app/generated
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  generated:
